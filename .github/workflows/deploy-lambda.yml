# ==========================================================
# GitHub Actions workflow：自動部署 AWS Lambda（含依賴安裝）
# ----------------------------------------------------------
# 當 develop 分支有 push 時，自動：
#   1. 取得 OIDC 驗證登入 AWS
#   2. 安裝 requirements.txt 依賴
#   3. 打包整個專案成 zip（包含依賴）
#   4. 更新指定的 Lambda 函數程式碼
# ==========================================================

name: Deploy Lambda

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.lambdaignore'
      - '.github/**'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # Step 0. 輸出參數設定
      - name: Check deploy infos
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "AWS_ROLE_ARN is missing!"
          else
            echo "AWS_ROLE_ARN is set (value masked)."
          fi
          if [ -z "${{ secrets.AWS_REGION }}" ]; then
            echo "AWS_REGION is missing!"
          else
            echo "AWS_REGION is set (value masked)."
          fi
          if [ -z "${{ secrets.LAMBDA_FUNCTION_NAME }}" ]; then
            echo "LAMBDA_FUNCTION_NAME is missing!"
          else
            echo "LAMBDA_FUNCTION_NAME is set (value masked)."
          fi

      # Step 1. 抓取原始碼
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 2. 使用 OIDC 登入 AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3. 在 Amazon Linux 環境中安裝依賴
      - name: Install dependencies (Amazon Linux compatible)
        run: |
          docker run --rm \
            -v "$PWD":/var/task \
            -w /var/task \
            --entrypoint /bin/bash \
            public.ecr.aws/lambda/python:3.13 \
            -c "pip install -r requirements.txt -t . && rm -rf __pycache__"

      # Step 4. 打包 Lambda 原始碼與依賴
      - name: Package Lambda function
        run: |
          zip -r function.zip . -x@.lambdaignore

      # Step 5. 確認打包內容
      - name: List files after zip
        run: unzip -l function.zip | head -n 50

      # Step 6. 更新 Lambda 函數程式碼
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://function.zip

      # Step 7. 等待 Lambda 更新完成
      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      # Step 8. 更新環境變數（選用）
      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --environment "Variables={ANTHROPIC_KEY=${{ secrets.ANTHROPIC_KEY }}}"
